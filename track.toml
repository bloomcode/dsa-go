file = "ch01/arrays.go"

[[chapters]]
n = 2
title = "Ordered arrays and binary search"
short = "Ordered arrays"
focus = "Keeping data sorted makes insertion slower and search exponentially faster."
file = "ch02/ordered.go"

[[chapters]]
n = 3
title = "Big O: how the step count grows"
